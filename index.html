<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff5fa2">
<meta name="description" content="Sugar Burst — a candy match-3 puzzle game with 60 levels, special candies and super combos.">
<title>Sugar Burst</title>
<style>
:root {
  --pink: #ff5fa2;
  --pink-d: #d6307a;
  --purple: #7b3fe4;
  --purple-d: #4b1f9e;
  --mint: #36d6b0;
  --yellow: #ffd23f;
  --ink: #5a1740;
  --panel: rgba(255, 255, 255, .94);
  --font: "Arial Rounded MT Bold", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Heiti SC", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden; background: #2a0f4a;
  font-family: var(--font); color: var(--ink);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; overscroll-behavior: none;
}
body { background: radial-gradient(ellipse at 50% 0%, #6b2fb3 0%, #2a0f4a 70%); }
#app {
  position: relative; margin: 0 auto; height: 100%; width: 100%; max-width: 560px; overflow: hidden;
  background: #ffd9ec; box-shadow: 0 0 60px rgba(0, 0, 0, .45);
}
canvas { display: block; }
.screen { position: absolute; inset: 0; display: none; }
#screen-title, #screen-game { touch-action: none; }
.screen.on { display: block; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 60; }
#board { position: absolute; inset: 0; touch-action: none; }

/* ---------- outlined bubbly text ---------- */
.o-text {
  color: #fff;
  text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink),
    1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink),
    0 4px 0 rgba(90, 23, 64, .55);
}

/* ---------- buttons ---------- */
.btn {
  --c1: #7cf29a; --c2: #20bf5c; --c3: #10803a;
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 120px; height: 54px; padding: 0 22px; border: 0; border-radius: 27px; cursor: pointer;
  font: 900 21px var(--font); letter-spacing: 1px; color: #fff;
  background: linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: 0 6px 0 var(--c3), 0 10px 18px rgba(0, 0, 0, .25), inset 0 2px 0 rgba(255, 255, 255, .6);
  text-shadow: 0 2px 0 var(--c3), 1px 0 0 var(--c3), -1px 0 0 var(--c3), 0 -1px 0 var(--c3);
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.btn::before {
  content: ""; position: absolute; left: 14px; right: 14px; top: 6px; height: 36%;
  border-radius: 20px; background: linear-gradient(180deg, rgba(255, 255, 255, .7), rgba(255, 255, 255, 0));
  pointer-events: none;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--c3), 0 4px 8px rgba(0, 0, 0, .25), inset 0 2px 0 rgba(255, 255, 255, .6); }
.btn.orange { --c1: #ffc15c; --c2: #ff7a1a; --c3: #b84a00; }
.btn.pink { --c1: #ff9ccb; --c2: #ff3d8e; --c3: #a8185a; }
.btn.blue { --c1: #8fdcff; --c2: #2b8cff; --c3: #1450b0; }
.btn.purple { --c1: #c99cff; --c2: #8a3dff; --c3: #4f1aa6; }
.btn.small { height: 42px; min-width: 0; font-size: 17px; padding: 0 16px; border-radius: 21px; }
.btn.big { height: 64px; font-size: 26px; min-width: 200px; border-radius: 32px; }
.btn[disabled] { filter: grayscale(.8) brightness(.9); pointer-events: none; }
.btn .coin-ic { width: 22px; height: 22px; }

.round-btn {
  width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fff; cursor: pointer;
  background: linear-gradient(180deg, #ff9ccb, #e83e8c); box-shadow: 0 4px 0 #a8185a, 0 6px 12px rgba(0, 0, 0, .25);
  display: flex; align-items: center; justify-content: center; padding: 0;
}
.round-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8185a; }
.round-btn svg { width: 22px; height: 22px; fill: #fff; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .3)); }

/* ---------- title screen ---------- */
#screen-title { background: transparent; }
#title-canvas { position: absolute; inset: 0; }
.title-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.logo { position: relative; text-align: center; margin-top: -60px; animation: logoIn 1s cubic-bezier(.2, 1.6, .4, 1) both; }
.logo .name {
  display: block; font-size: 76px; font-weight: 900; letter-spacing: 2px; line-height: .98;
  background: linear-gradient(180deg, #fff 0%, #ffe3f1 30%, #ff7ab8 60%, #e8267a 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #7a1045) drop-shadow(0 -2px 0 #7a1045) drop-shadow(3px 0 0 #7a1045) drop-shadow(-3px 0 0 #7a1045) drop-shadow(0 8px 10px rgba(80, 0, 40, .45));
}
.logo .tag {
  display: inline-block; margin-top: 12px; padding: 6px 18px; border-radius: 20px; font-size: 20px; font-weight: 900; letter-spacing: 4px;
  color: #fff; background: linear-gradient(90deg, #7b3fe4, #ff5fa2); box-shadow: 0 4px 0 #4b1f9e, 0 8px 16px rgba(0, 0, 0, .25);
}
.title-wrap .btn { animation: pulse 1.6s ease-in-out infinite; }
.title-foot { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(90, 23, 64, .6); }
@keyframes logoIn { from { transform: scale(.3) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* ---------- map ---------- */
#screen-map { background: #ffd9ec; }
#map-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; scrollbar-width: none; }
#map-scroll::-webkit-scrollbar { display: none; }
#map-inner { position: relative; width: 100%; }
.zone { position: absolute; left: 0; right: 0; overflow: hidden; }
.zone-sign {
  position: absolute; left: 50%; transform: translateX(-50%); padding: 8px 20px 10px; border-radius: 16px;
  font-size: 18px; font-weight: 900; white-space: nowrap; color: #fff; border: 3px solid #fff;
  box-shadow: 0 5px 0 rgba(0, 0, 0, .2), 0 10px 20px rgba(0, 0, 0, .15); z-index: 3;
}
.zone-sign small { display: block; font-size: 11px; letter-spacing: 3px; opacity: .85; text-align: center; }
.decor { position: absolute; pointer-events: none; z-index: 1; }
#map-path { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; }
.node {
  position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; z-index: 4; cursor: pointer;
  display: flex; align-items: center; justify-content: center; border: 4px solid #fff;
  font: 900 24px var(--font); color: #fff;
  background: radial-gradient(circle at 35% 30%, #ffc2de 0%, #ff5fa2 45%, #c2266c 100%);
  box-shadow: 0 6px 0 #8e1450, 0 10px 18px rgba(0, 0, 0, .3), inset 0 -4px 8px rgba(0, 0, 0, .15);
  text-shadow: 0 2px 0 #8e1450, 1px 0 0 #8e1450, -1px 0 0 #8e1450, 0 -1px 0 #8e1450;
  transition: transform .1s;
}
.node:active { transform: scale(.92); }
.node.done { background: radial-gradient(circle at 35% 30%, #b7f7ff 0%, #3cb8ff 45%, #1a64c9 100%); box-shadow: 0 6px 0 #0f3f8a, 0 10px 18px rgba(0, 0, 0, .3); text-shadow: 0 2px 0 #0f3f8a, 1px 0 0 #0f3f8a, -1px 0 0 #0f3f8a, 0 -1px 0 #0f3f8a; }
.node.locked { background: radial-gradient(circle at 35% 30%, #f1eaf3 0%, #bfb1c8 50%, #8d7d99 100%); box-shadow: 0 6px 0 #5d4f68, 0 8px 12px rgba(0, 0, 0, .2); color: #f6f0f8; text-shadow: 0 2px 0 #5d4f68; cursor: default; }
.node.cur { animation: nodePulse 1.2s ease-in-out infinite; }
.node.cur::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; border: 4px solid rgba(255, 255, 255, .8); animation: ring 1.2s ease-out infinite; }
@keyframes nodePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes ring { from { transform: scale(.8); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
.node .stars { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); display: flex; gap: 0; }
.node .stars img { width: 22px; height: 22px; }
.node .stars img:nth-child(2) { transform: translateY(-6px); }
.node .lock-ic { width: 28px; height: 28px; opacity: .9; }
.mascot { position: absolute; width: 64px; height: 64px; margin: -118px 0 0 -32px; z-index: 5; pointer-events: none; animation: hop 1s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 45% { transform: translateY(-12px) scale(.96, 1.04); } 90% { transform: translateY(0) scale(1.08, .92); } }

.map-top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px; pointer-events: none;
}
.map-top > * { pointer-events: auto; }
.pill {
  display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px 0 6px; border-radius: 19px;
  background: rgba(255, 255, 255, .92); border: 3px solid #ffb3d4; font-weight: 900; font-size: 17px; color: var(--ink);
  box-shadow: 0 4px 0 rgba(168, 24, 90, .35);
}
.pill img { width: 28px; height: 28px; }
.pill .plus { width: 22px; height: 22px; border-radius: 50%; background: #20bf5c; color: #fff; font-size: 18px; line-height: 20px; text-align: center; margin-left: 4px; }
.spacer { flex: 1; }

/* ---------- game HUD ---------- */
.hud-top { position: absolute; left: 0; right: 0; top: 0; z-index: 10; padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px 0; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.hud-row { display: flex; align-items: stretch; gap: 6px; }
.hud-panel {
  background: linear-gradient(180deg, rgba(255, 255, 255, .96), rgba(255, 236, 246, .94));
  border: 3px solid #fff; border-radius: 18px; box-shadow: 0 4px 0 rgba(168, 24, 90, .35), 0 8px 18px rgba(80, 0, 60, .18), inset 0 0 0 2px #ffc2dd;
  position: relative;
}
.hud-lbl { font-size: 11px; font-weight: 900; color: #c2266c; letter-spacing: 2px; text-align: center; padding-top: 4px; }
.moves-box { width: 76px; display: flex; flex-direction: column; align-items: center; }
.moves-box .num { font-size: 40px; font-weight: 900; line-height: 44px; color: #fff; background: none; }
.moves-box.warn .num { animation: warnPulse .7s ease-in-out infinite; }
@keyframes warnPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); filter: hue-rotate(-30deg); } }
.goals-box { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.goals { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 4px 4px; }
.goal { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 44px; }
.goal canvas { width: 38px; height: 38px; }
.goal .cnt { font-size: 16px; font-weight: 900; margin-top: -4px; }
.goal .chk {
  position: absolute; right: 0; bottom: 14px; width: 20px; height: 20px; border-radius: 50%; background: #20bf5c; border: 2px solid #fff;
  display: none; color: #fff; font-size: 13px; line-height: 16px; text-align: center; font-weight: 900; box-shadow: 0 2px 0 #10803a;
}
.goal.done .chk { display: block; animation: pop .35s cubic-bezier(.2, 1.8, .4, 1); }
.goal.done .cnt { visibility: hidden; }
.goal.bump canvas { animation: bump .25s ease-out; }
@keyframes bump { 50% { transform: scale(1.3); } }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.score-box { width: 104px; display: flex; flex-direction: column; align-items: center; padding: 0 8px; }
.score-box .num { font-size: 19px; font-weight: 900; line-height: 26px; }
.sbar { position: relative; width: 100%; height: 12px; margin-top: 2px; border-radius: 6px; background: rgba(90, 23, 64, .15); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .15); }
.sbar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px; background: linear-gradient(180deg, #fff27a, #ffb000); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .12); transition: width .3s; }
.sbar img { position: absolute; top: -7px; width: 22px; height: 22px; margin-left: -11px; filter: grayscale(1) opacity(.55); transition: filter .3s, transform .3s; }
.sbar img.on { filter: none; transform: scale(1.2); }
.hud-sub { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.lvl-tag { padding: 4px 14px; border-radius: 14px; background: linear-gradient(90deg, #7b3fe4, #ff5fa2); color: #fff; font-weight: 900; font-size: 15px; box-shadow: 0 3px 0 #4b1f9e; }
.hud-sub .round-btn { width: 38px; height: 38px; }
.hud-sub .round-btn svg { width: 18px; height: 18px; }

.hud-bottom {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; gap: 12px;
  padding: 0 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
}
.boost {
  position: relative; width: 62px; height: 62px; border-radius: 20px; border: 3px solid #fff; cursor: pointer; padding: 0;
  background: radial-gradient(circle at 50% 30%, #fff 0%, #ffe0f0 60%, #ffc2dd 100%);
  box-shadow: 0 5px 0 #d6307a, 0 8px 14px rgba(80, 0, 60, .25);
  transition: transform .1s;
}
.boost:active { transform: translateY(3px); }
.boost img { width: 50px; height: 50px; margin-top: 2px; pointer-events: none; }
.boost .badge {
  position: absolute; right: -8px; top: -8px; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 12px; border: 2px solid #fff;
  background: #ff3d6e; color: #fff; font-size: 14px; font-weight: 900; line-height: 20px; text-align: center; box-shadow: 0 2px 0 #a8185a;
}
.boost .badge.buy { background: #20bf5c; box-shadow: 0 2px 0 #10803a; }
.boost.active { transform: translateY(-6px) scale(1.08); box-shadow: 0 0 0 4px #ffd23f, 0 0 24px 6px rgba(255, 210, 63, .8); }
.boost-tip {
  position: absolute; left: 50%; transform: translateX(-50%); z-index: 12; padding: 10px 16px; border-radius: 16px; white-space: nowrap;
  background: rgba(60, 20, 90, .88); color: #fff; font-weight: 900; font-size: 15px; display: none; align-items: center; gap: 10px;
  box-shadow: 0 6px 16px rgba(0, 0, 0, .3);
}
.boost-tip.on { display: flex; animation: pop .25s cubic-bezier(.2, 1.6, .4, 1); }
.boost-tip button { border: 0; border-radius: 12px; padding: 5px 10px; font: 900 13px var(--font); background: #ff5fa2; color: #fff; cursor: pointer; }

/* ---------- modal ---------- */
#modal {
  position: absolute; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
  background: rgba(40, 10, 60, .55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
#modal.on { display: flex; animation: fadeIn .2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.panel {
  position: relative; width: min(92%, 400px); max-height: 92%; overflow: visible; padding: 50px 20px 22px; border-radius: 30px;
  background: linear-gradient(180deg, #fff 0%, #fff3f9 100%);
  border: 5px solid #ffb3d4; box-shadow: 0 10px 0 #d6307a, 0 24px 50px rgba(0, 0, 0, .4), inset 0 0 0 3px #fff;
  animation: panelIn .45s cubic-bezier(.2, 1.5, .4, 1) both; text-align: center;
}
@keyframes panelIn { from { transform: scale(.5) translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.ribbon {
  position: absolute; left: 50%; top: -28px; transform: translateX(-50%); min-width: 220px; padding: 10px 30px 12px; border-radius: 18px;
  background: linear-gradient(180deg, #ff8cc4, #e8267a); border: 4px solid #fff; box-shadow: 0 6px 0 #8e1450, 0 10px 18px rgba(0, 0, 0, .25);
  font-size: 28px; font-weight: 900; color: #fff; white-space: nowrap;
  text-shadow: 0 3px 0 #8e1450, 2px 0 0 #8e1450, -2px 0 0 #8e1450, 0 -2px 0 #8e1450;
}
.ribbon.purple { background: linear-gradient(180deg, #c99cff, #7b3fe4); box-shadow: 0 6px 0 #4b1f9e, 0 10px 18px rgba(0, 0, 0, .25); text-shadow: 0 3px 0 #4b1f9e, 2px 0 0 #4b1f9e, -2px 0 0 #4b1f9e, 0 -2px 0 #4b1f9e; }
.ribbon.gray { background: linear-gradient(180deg, #b9a8c6, #7d6a8e); box-shadow: 0 6px 0 #4a3c57, 0 10px 18px rgba(0, 0, 0, .25); text-shadow: 0 3px 0 #4a3c57, 2px 0 0 #4a3c57, -2px 0 0 #4a3c57, 0 -2px 0 #4a3c57; }
.close-x {
  position: absolute; right: -14px; top: -14px; width: 44px; height: 44px; border-radius: 50%; border: 4px solid #fff; cursor: pointer; z-index: 2;
  background: linear-gradient(180deg, #ff8a8a, #e8333d); color: #fff; font: 900 22px/34px var(--font); box-shadow: 0 4px 0 #8e1418; padding: 0;
}
.p-sub { font-size: 16px; font-weight: 900; color: #c2266c; margin: 4px 0 10px; letter-spacing: 1px; }
.p-goals { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; padding: 12px; margin: 0 0 14px; border-radius: 20px; background: rgba(255, 95, 162, .1); border: 2px dashed #ffb3d4; }
.p-goal { display: flex; flex-direction: column; align-items: center; font-weight: 900; font-size: 18px; }
.p-goal canvas { width: 54px; height: 54px; }
.p-goal .done { color: #20bf5c; }
.p-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.p-text { font-size: 15px; line-height: 1.6; color: #6b2a52; margin: 6px 4px 12px; font-weight: 700; }
.tip-card { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 12px; margin: 0 0 14px; border-radius: 18px; background: linear-gradient(90deg, #fff6c9, #ffe9f4); border: 2px solid #ffd23f; }
.tip-card canvas { flex: none; width: 110px; height: 66px; }
.tip-card .tt { font-size: 13px; line-height: 1.45; font-weight: 700; color: #6b2a52; }
.tip-card .tt b { display: block; color: #e8267a; font-size: 15px; }
.tip-new { display: inline-block; padding: 1px 8px; margin-right: 4px; border-radius: 8px; background: #ff3d6e; color: #fff; font-size: 11px; vertical-align: 2px; }
.pre-row { display: flex; justify-content: center; gap: 12px; margin: 0 0 16px; }
.pre { position: relative; width: 70px; height: 70px; border-radius: 20px; border: 3px solid #ffd0e5; background: #fff; cursor: pointer; padding: 0; transition: transform .1s; }
.pre img { width: 54px; height: 54px; margin-top: 4px; }
.pre .badge { position: absolute; right: -8px; top: -8px; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 12px; border: 2px solid #fff; background: #ff3d6e; color: #fff; font-size: 13px; font-weight: 900; line-height: 20px; }
.pre .badge.buy { background: #20bf5c; }
.pre.sel { border-color: #20bf5c; box-shadow: 0 0 0 3px #7cf29a, 0 0 18px rgba(32, 191, 92, .6); transform: scale(1.05); }
.pre.sel::after { content: "✓"; position: absolute; left: -8px; top: -8px; width: 24px; height: 24px; border-radius: 50%; background: #20bf5c; color: #fff; font-weight: 900; line-height: 22px; border: 2px solid #fff; }
.pre-lbl { font-size: 12px; font-weight: 900; color: #c2266c; margin: -6px 0 8px; letter-spacing: 1px; }
.win-stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 96px; margin: -6px 0 6px; }
.win-stars canvas { width: 76px; height: 76px; }
.win-stars canvas:nth-child(2) { width: 92px; height: 92px; margin-bottom: 14px; }
.win-score { font-size: 38px; font-weight: 900; margin: 0 0 4px; }
.win-reward { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 16px; background: #fff6c9; border: 2px solid #ffd23f; font-weight: 900; font-size: 18px; margin-bottom: 14px; }
.win-reward img { width: 26px; height: 26px; }
.set-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 8px; border-bottom: 2px dashed #ffd0e5; font-size: 18px; font-weight: 900; }
.toggle { position: relative; width: 64px; height: 34px; border-radius: 17px; background: #d8c8e0; cursor: pointer; transition: background .2s; box-shadow: inset 0 2px 4px rgba(0, 0, 0, .2); border: 0; }
.toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .3); transition: left .2s; }
.toggle.on { background: #20bf5c; }
.toggle.on::after { left: 33px; }
.shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.shop-item { padding: 10px 6px; border-radius: 18px; background: #fff; border: 2px solid #ffd0e5; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.shop-item img.ic { width: 52px; height: 52px; }
.shop-item .nm { font-weight: 900; font-size: 15px; }
.shop-item .ds { font-size: 11px; color: #9a5a80; min-height: 28px; line-height: 1.3; }
.shop-item .own { font-size: 12px; color: #c2266c; font-weight: 900; }

/* ---------- toast & banners ---------- */
#toast {
  position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 70; pointer-events: none; display: none;
  padding: 14px 22px; border-radius: 20px; background: rgba(60, 20, 90, .9); color: #fff; font-weight: 900; font-size: 18px; text-align: center;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35); max-width: 86%;
}
#toast.on { display: block; animation: toastIn 1.8s ease both; }
@keyframes toastIn { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 18% { transform: translate(-50%, -50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%); } }
.goal-banner {
  position: absolute; left: 50%; top: 45%; z-index: 30; transform: translate(-50%, -50%); pointer-events: none;
  padding: 16px 26px 18px; border-radius: 26px; background: linear-gradient(180deg, rgba(255, 255, 255, .97), rgba(255, 235, 246, .97));
  border: 4px solid #ffb3d4; box-shadow: 0 8px 0 #d6307a, 0 20px 40px rgba(0, 0, 0, .35); text-align: center;
  animation: bannerInOut 2.2s cubic-bezier(.2, 1.3, .4, 1) both;
}
.goal-banner { width: min(86%, 340px); }
.goal-banner .t { font-size: 18px; line-height: 1.35; font-weight: 900; color: #e8267a; margin-bottom: 8px; }
.goal-banner .p-goals { margin: 0; background: none; border: 0; padding: 0; }
@keyframes bannerInOut { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -150%) scale(.6); opacity: 0; } }
.hand {
  position: absolute; z-index: 25; width: 56px; height: 56px; pointer-events: none; display: none;
  filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .3));
}
.hand.on { display: block; }
.fade-cover { position: absolute; inset: 0; z-index: 80; background: #ffd9ec; pointer-events: none; opacity: 0; transition: opacity .35s; }
.fade-cover.on { opacity: 1; pointer-events: auto; }
@media (max-height: 640px) {
  .moves-box .num { font-size: 32px; line-height: 36px; }
  .goal canvas { width: 32px; height: 32px; }
  .boost { width: 54px; height: 54px; }
  .boost img { width: 42px; height: 42px; }
}

#rotate { display: none; }
@media (orientation: landscape) and (max-height: 500px) and (pointer: coarse) {
  #rotate {
    display: flex; position: fixed; inset: 0; z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
    background: linear-gradient(180deg, #ff9ccb, #7b3fe4); color: #fff; font: 900 22px var(--font); text-align: center;
  }
  #rotate i { display: block; width: 46px; height: 76px; border: 5px solid #fff; border-radius: 10px; animation: rot 1.6s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0); } }
}
@media (prefers-reduced-motion: reduce) {
  .title-wrap .btn, .node.cur, .node.cur::after, .mascot, .moves-box.warn .num { animation: none !important; }
}

@media (max-height: 700px) {
  .panel { padding: 44px 16px 18px; }
  .p-goals { padding: 8px; margin-bottom: 10px; }
  .p-goal canvas { width: 46px; height: 46px; }
  .p-text { margin: 4px 4px 8px; font-size: 14px; }
  .tip-card { margin-bottom: 10px; padding: 8px 10px; }
  .pre { width: 62px; height: 62px; }
  .pre img { width: 48px; height: 48px; }
  .pre-row { margin-bottom: 12px; }
  .btn.big { height: 58px; font-size: 24px; }
}

    ctx.lineWidth = s * 0.018;
    ctx.strokeStyle = rgba(col.dark, 0.9);
    ctx.stroke();

  function cherryPath(c, r) {

  var CHERRY = pal('#ff2448', '#ffa0ae', '#8e0019');
  function drawCherryImpl(ctx, s) {
    var r = 0.2 * s;

      ctx.moveTo(c2[0], c2[1] - 0.12 * s);

      c.moveTo(joint[0], joint[1]);

    ctx.fillStyle = lin(ctx, 0.05 * s, -0.45 * s, 0.35 * s, -0.3 * s, [0, '#b6f26a', 0.5, '#5cc42a', 1, '#2f8a12']);

  var NUT = pal('#c77a36', '#f6c98a', '#6a3610');

    var R = s * 0.42;

      c.bezierCurveTo(0.3 * R, 0.84 * R, 0.72 * R, 0.46 * R, 0.66 * R, -0.12 * R);

      c.moveTo(-0.82 * R, -0.04 * R);

          c.beginPath();
          c.moveTo(i * 0.3 * R, 0.05 * R);

  function drawCandy(ctx, color, kind, s) {
    ctx.save();
    try {
      var rc = resolveColor(color);
      switch (kind || 'normal') {
        case 'bomb': drawBombImpl(ctx, s); break;
        case 'cherry': drawCherryImpl(ctx, s); break;
        case 'nut': drawNutImpl(ctx, s); break;
        case 'wrap': drawWrapImpl(ctx, rc.col, s); break;
        case 'fish': drawFishImpl(ctx, rc.col, s); break;
        case 'sh': case 'sv': drawShapeCandy(ctx, rc.idx, rc.col, s, kind); break;
        default: drawShapeCandy(ctx, rc.idx, rc.col, s, 'normal');
      }
    } finally {
      ctx.restore();
    }
  }

  /* ------------------------------------------------------------------ */
  /* board tiles: jelly / frost / lock                                   */
  /* ------------------------------------------------------------------ */
  function jellyImpl(ctx, level, s, boost) {
    var w = s * 0.96, r = s * 0.2, two = level >= 2;
    var b = boost || 1;
    var P = function (c) { rrect(c, -w / 2, -w / 2, w, w, r); };
    function A(a) { return Math.min(1, a * b); }
    ctx.beginPath(); P(ctx);
    ctx.fillStyle = rad(ctx, -0.25 * s, -0.3 * s, 0, 0, 0, 0.72 * s, two ?
      [0, 'rgba(255,165,225,' + A(0.6) + ')', 0.55, 'rgba(240,70,185,' + A(0.58) + ')', 1, 'rgba(190,20,140,' + A(0.78) + ')'] :
      [0, 'rgba(255,195,238,' + A(0.42) + ')', 0.55, 'rgba(255,120,212,' + A(0.46) + ')', 1, 'rgba(240,70,185,' + A(0.62) + ')']);
    ctx.fill();
    // thickness at the edges
    innerShadow(ctx, P, two ? 'rgba(150,0,105,0.9)' : 'rgba(215,40,160,0.7)', s * (two ? 0.1 : 0.07), 0, 0, s * 2);
    innerShadow(ctx, P, 'rgba(255,255,255,0.85)', s * 0.03, s * 0.015, s * 0.022, s * 2);
    innerShadow(ctx, P, two ? 'rgba(120,0,80,0.6)' : 'rgba(190,30,140,0.4)', s * 0.03, -s * 0.01, -s * 0.02, s * 2);
    // inner borders
    var insets = two ? [0.055, 0.12] : [0.06];
    for (var i = 0; i < insets.length; i++) {
      var d = insets[i] * s, ww = w - 2 * d;
      ctx.beginPath();
      rrect(ctx, -ww / 2, -ww / 2, ww, ww, Math.max(r - d * 0.9, s * 0.04));
      ctx.lineWidth = s * (two ? 0.022 : 0.018);
      ctx.strokeStyle = i === 0 ? 'rgba(255,235,250,0.75)' : 'rgba(255,215,245,0.55)';
      ctx.stroke();
      if (two) {
        ctx.beginPath();
        rrect(ctx, -ww / 2 + s * 0.012, -ww / 2 + s * 0.016, ww, ww, Math.max(r - d * 0.9, s * 0.04));
        ctx.lineWidth = s * 0.012;
        ctx.strokeStyle = 'rgba(140,0,95,0.35)';
        ctx.stroke();
      }
    }
    // outer rim
    ctx.beginPath(); P(ctx);
    ctx.lineWidth = s * 0.022;
    ctx.strokeStyle = two ? 'rgba(135,0,95,0.95)' : 'rgba(195,50,150,0.85)';
    ctx.stroke();
    // corner glints
    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(-w / 2 + r, -w / 2 + r, r - s * 0.035, PI * 1.08, PI * 1.42);
    ctx.lineWidth = s * 0.035;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.stroke();
    ctx.beginPath();
    circle(ctx, -w / 2 + r + s * 0.09, -w / 2 + s * 0.036, s * 0.013);
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w / 2 - r, w / 2 - r, r - s * 0.04, PI * 0.12, PI * 0.36);
    ctx.lineWidth = s * 0.02;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.stroke();
    ctx.restore();
    // broad gel sheen across the top band (visible above a candy)
    ctx.save();
    ctx.beginPath(); P(ctx); ctx.clip();
    ctx.beginPath();
    ellipse(ctx, -0.04 * s, -0.46 * s, 0.5 * s, 0.14 * s, 0);
    ctx.fillStyle = lin(ctx, 0, -0.6 * s, 0, -0.32 * s, [0, 'rgba(255,255,255,0.5)', 1, 'rgba(255,255,255,0)']);
    ctx.fill();
    ctx.restore();
  }
  function drawJelly(ctx, level, s) {
    ctx.save();

  }

  function icingPath(c, x0, x1, yTop, yBase, drips) {
    c.moveTo(x0, yTop);
    c.lineTo(x1, yTop);
    c.lineTo(x1, yBase);
    var ds = drips.slice().sort(function (a, b) { return b[0] - a[0]; });
    for (var i = 0; i < ds.length; i++) {
      var x = ds[i][0], len = ds[i][1], w = ds[i][2];
      var prevX = i === 0 ? x1 : ds[i - 1][0] - ds[i - 1][2] / 2;
      var midX = (prevX + x + w / 2) / 2;
      c.quadraticCurveTo(midX, yBase + len * 0.12, x + w / 2 + w * 0.15, yBase + len * 0.05);
      c.bezierCurveTo(x + w / 2, yBase + len * 0.5, x + w / 2, yBase + len, x, yBase + len);
      c.bezierCurveTo(x - w / 2, yBase + len, x - w / 2, yBase + len * 0.5, x - w / 2 - w * 0.15, yBase + len * 0.05);
    }
    c.quadraticCurveTo(x0 + 0.02 * (x1 - x0), yBase + 0.01 * (x1 - x0), x0, yBase);
    c.closePath();
  }

  function drawFrost(ctx, hp, s) {
    ctx.save();
    try {
      hp = Math.max(1, Math.min(3, hp | 0));
      if (hp === 3) frost3(ctx, s);
      else if (hp === 2) frost2(ctx, s);
      else frost1(ctx, s);
    } finally { ctx.restore(); }
  }

  function frost3(ctx, s) {
    var w = s * 0.92, h = s * 0.9, x = -w / 2, y = -h / 2 - s * 0.01, r = s * 0.16;
    var P = function (c) { rrect(c, x, y, w, h, r); };
    shadowFill(ctx, P, 'rgba(40,0,40,0.4)', s * 0.035, 0, s * 0.025);
    ctx.save();
    ctx.beginPath(); P(ctx);
    ctx.fillStyle = lin(ctx, 0, y, 0, y + h, [0, '#ffa6cf', 0.5, '#f76aa8', 1, '#d2417f']);
    ctx.fill();
    ctx.clip();
    // cream band (wavy)
    var by = 0.2 * s, bh = 0.075 * s;
    ctx.beginPath();
    ctx.moveTo(-s, by);
    for (var i = 0; i <= 8; i++) {

      ctx.quadraticCurveTo(xx - w / 16, by + (i % 2 ? -1 : 1) * s * 0.012, xx, by);

      }
      ctx.arc(0, 0, R * 1.02, a0 + twist, a1 + twist);

      ctx.closePath();

  function stick(ctx, x0, y0, x1, y1, w, s) {

    var bB = [Math.cos(a1 - ah) * (r - head * 0.62), Math.sin(a1 - ah) * (r - head * 0.62)];
    var headPath = function () {
      ctx.beginPath();

  function badgeText(ctx, txt, size, stroke) {

  function scallopPath(c, R, n, amp) {

    ctx.beginPath();

  function drawHammer(ctx, s) {

  function drawBooster(ctx, name, s) {
    ctx.save();

  function canePath(c, cx, yb, y0, rh, w, hd) {
    c.moveTo(cx + w / 2, yb);
    c.lineTo(cx + w / 2, y0);
    c.arc(cx - rh, y0, rh + w / 2, 0, -PI, true);
    c.lineTo(cx - 2 * rh - w / 2, y0 + hd);
    c.arc(cx - 2 * rh, y0 + hd, w / 2, PI, 0, true);
    c.lineTo(cx - 2 * rh + w / 2, y0);
    c.arc(cx - rh, y0, rh - w / 2, -PI, 0, false);
    c.lineTo(cx - w / 2, yb);
    c.arc(cx, yb, w / 2, PI, 0, true);
    c.closePath();
  }
  function drawCane(ctx, s) {

      if (u <= Ls) return [cx, yb - u, 0, -1];
      if (u <= Ls + La) {
        var a = -(u - Ls) / rh; // 0 -> -PI
        return [cx - rh + Math.cos(a) * rh, y0 + Math.sin(a) * rh, Math.sin(a), -Math.cos(a)];
      }
      var v = u - Ls - La;
      return [cx - 2 * rh, y0 + v, 0, 1];
    };
    shadowFill(ctx, P, 'rgba(30,0,50,0.35)', s * 0.04, s * 0.02, s * 0.03);
    ctx.beginPath(); P(ctx);
    ctx.fillStyle = '#fffafa'; ctx.fill();
    ctx.save();
    ctx.beginPath(); P(ctx); ctx.clip();
    ctx.fillStyle = '#f01f45';
    var step = w * 1.2;
    for (var u = -w; u < total + w; u += step) {

      var p1 = at(Math.max(0, Math.min(total, u + step * 0.45)));

      var sl = w * 0.45;

      ctx.lineTo(p0[0] + nx0 * w + p0[2] * sl, p0[1] + ny0 * w + p0[3] * sl);
      ctx.lineTo(p1[0] + nx1 * w + p1[2] * sl, p1[1] + ny1 * w + p1[3] * sl);
      ctx.lineTo(p1[0] - nx1 * w - p1[2] * sl, p1[1] - ny1 * w - p1[3] * sl);

    ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.3, yb + w);
    ctx.lineTo(cx + w * 0.3, y0);
    ctx.arc(cx - rh, y0, rh - w * 0.3, 0, -PI, true);
    ctx.lineTo(cx - 2 * rh + w * 0.3, y0 + hd + w);
    ctx.lineWidth = w * 0.45; ctx.strokeStyle = 'rgba(110,0,30,0.25)'; ctx.stroke();

    ctx.moveTo(cx - w * 0.22, yb);
    ctx.lineTo(cx - w * 0.22, y0);
    ctx.arc(cx - rh, y0, rh + w * 0.22, 0, -PI, true);
    ctx.lineTo(cx - 2 * rh - w * 0.22, y0 + hd);

    ctx.restore();
    ctx.beginPath(); P(ctx);
    ctx.lineJoin = 'round'; ctx.lineWidth = s * 0.025; ctx.strokeStyle = '#9e0a2e'; ctx.stroke();

      c.bezierCurveTo(-0.09 * s, 0.08 * s, -0.04 * s, 0.04 * s, 0, 0);
      c.bezierCurveTo(0.08 * s, -0.09 * s, 0.16 * s, -0.02 * s, 0.12 * s, 0.05 * s);
      c.bezierCurveTo(0.09 * s, 0.08 * s, 0.04 * s, 0.04 * s, 0, 0);
      c.closePath();
      c.moveTo(-0.01 * s, 0.01 * s);
      c.lineTo(-0.07 * s, 0.14 * s); c.lineTo(-0.035 * s, 0.13 * s); c.lineTo(0, 0.02 * s);

  async function afterTurn() {

    // make sure displayed goals match the model
    for (var k in game.left) if (k !== 'score' && disp.left[k] !== game.left[k] && board.flights === 0) setGoalCount(k, game.left[k]);

  async function winFlow() {
    board.busy = true;

    board.word('Goals Complete!', 1);
    snd('sugar');

    game.eachCell(function (cl) { if (cl.candy && Model.isSpecial(cl.candy)) hasSpecial = true; });
    if (game.moves > 0 || hasSpecial) {
      board.word('Candy Party!', 3);

      await board.play(ph);
      board.bonus = false;

      await board.waitFlights();
    } else game.state = 'won';
    setMoves(0);
    await sleep(400);
    var stars = game.stars();
    var prev = S.stars[levelN] || 0;
    var reward = prev ? (stars > prev ? (stars - prev) * 15 : 5) : 20 + stars * 10;
    S.stars[levelN] = Math.max(prev, stars);

    if (S.unlocked === levelN && levelN < Levels.COUNT) S.unlocked = levelN + 1;
    S.coins += reward;

      r2.appendChild(btn('Restart', 'orange small', function () { closeModal(); startLevel(levelN); }));
      r2.appendChild(btn('Back to Map', 'blue small', function () { closeModal(); transition('map'); }));
      p.appendChild(r2);
    }, { ribbon: 'Paused', ribbonCls: 'purple' });
  }
  function settings() {
    modal(function (p) {
      soundRows(p);
      var r = h('div', 'p-row');
      r.style.marginTop = '16px';
      r.appendChild(btn('Reset Progress', 'pink small', function () {
        modal(function (q) {
          q.appendChild(h('div', 'p-text', 'Clear all level progress, stars and coins?<br>This can’t be undone.'));
          var rr = h('div', 'p-row');
          rr.appendChild(btn('Yes, Reset', 'pink small', function () {
            var keep = S.set; S = fresh(); S.set = keep; persist(); closeModal(); buildMap(); toast('Progress reset');
          }));
          rr.appendChild(btn('Cancel', 'small', function () { closeModal(); settings(); }));
          q.appendChild(rr);
        }, { ribbon: 'Reset Progress', ribbonCls: 'gray', onClose: settings });
      }));
      r.appendChild(btn('OK', 'small', function () { closeModal(); }));
      p.appendChild(r);
      p.appendChild(h('div', 'p-text', '<span style="font-size:12px;opacity:.7">Sugar Burst · All art and audio are generated in code</span>'));
    }, { ribbon: 'Settings', ribbonCls: 'purple' });
  }
  function today() { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function shop() {
    modal(function (p) {
      var daily = btn(S.daily === today() ? 'Daily bonus claimed' : '<img class="coin-ic" src="' + IC.coin() + '">Daily bonus +300', 'pink', function () {
        if (S.daily === today()) return;
        S.daily = today(); S.coins += 300; persist(); snd('coin'); updatePills(); closeModal(); shop(); toast('You got 300 coins!');
      });
      if (S.daily === today()) daily.disabled = true;
      var dr = h('div', 'p-row'); dr.style.marginBottom = '12px'; dr.appendChild(daily); p.appendChild(dr);
      var grid = h('div', 'shop-grid');
      BOOSTERS.concat(PRES).forEach(function (it) {
        var isPre = PRES.indexOf(it) >= 0;
        var d = h('div', 'shop-item');
        d.innerHTML = '<img class="ic" src="' + IC.booster(isPre ? it.icon : it.id) + '"><div class="nm">' + it.name + '</div><div class="ds">' + it.desc + '</div><div class="own">Owned: ' + ((isPre ? S.pre[it.id] : S.boosters[it.id]) || 0) + '</div>';
        var b = btn('<img class="coin-ic" src="' + IC.coin() + '">' + it.price, 'orange small', function () {
          if (S.coins < it.price) { toast('Not enough coins'); snd('invalid'); return; }
          S.coins -= it.price;
          if (isPre) S.pre[it.id] = (S.pre[it.id] || 0) + 1; else S.boosters[it.id] = (S.boosters[it.id] || 0) + 1;
          persist(); snd('coin'); updatePills(); closeModal(); shop();
        });
        d.appendChild(b);
        grid.appendChild(d);
      });
      p.appendChild(grid);
      p.appendChild(h('div', 'p-sub', 'Your coins: ' + S.coins));
    }, { ribbon: 'Candy Shop', ribbonCls: 'purple' });
  }

  // ---------------- layout ----------------
  function measureHud() {
    var top = $('.hud-top'), bot = $('.hud-bottom');
    var th = top.offsetHeight || 130, bh = bot.offsetHeight || 84;
    board.resize(W, H, th + 4, bh + 6);
  }
  function resize() {
    W = app.clientWidth; H = app.clientHeight;
    var tc = $('#title-canvas');
    tc.width = Math.ceil(W * DPR); tc.height = Math.ceil(H * DPR);
    tc.style.width = W + 'px'; tc.style.height = H + 'px';
    if (board) {
      if (cur === 'game') measureHud(); else board.resize(W, H, 130, 84);
    }
    if (cur === 'map' && MAP.built && MAP.w !== ($('#map-scroll').clientWidth || W)) buildMap();
  }

  // ---------------- boot ----------------
  function boot() {
    board = new SB.Board($('#board'), $('#fx'), UI);
    $('#btn-pause').innerHTML = SVG.pause;
    $('#btn-pause').onclick = function () { snd('tap'); pauseMenu(); };
    $('#btn-set').innerHTML = SVG.gear;
    $('#btn-set').onclick = function () { if (window.Snd) Snd.unlock(); snd('tap'); settings(); };
    $('#pill-coins img').src = IC.coin();
    $('#pill-stars img').src = IC.star();
    $('#pill-coins').onclick = function () { if (window.Snd) Snd.unlock(); snd('tap'); shop(); };
    drawHandIcon();
    initTitle();
    resize();
    applyAudio();
    window.addEventListener('resize', function () { resize(); });
    document.addEventListener('pointerdown', function () { if (window.Snd) Snd.unlock(); }, true);
    document.addEventListener('touchend', function () { if (window.Snd) Snd.unlock(); }, true);
    // favicon
    try {
      var fav = document.createElement('link'); fav.rel = 'icon'; fav.href = iconURL('fav', 32, function (x, s) { Art.drawCandy(x, 0, 'normal', s); });
      document.head.appendChild(fav);
    } catch (e) {}
    var last = performance.now();
    function frame(t) {
      var dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
      last = t;
      if (cur === 'game') { board.update(dt); board.draw(); }
      else if (cur === 'title') drawTitle(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    // debug hooks
    window.SUGAR = { S: S, start: startLevel, board: function () { return board; }, game: function () { return game; }, show: show, levelPopup: levelPopup, unlockAll: function () { S.unlocked = Levels.COUNT; persist(); buildMap(); } };
    var q = location.hash.match(/level=(\d+)/);
    if (q) { show('map'); startLevel(+q[1]); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
