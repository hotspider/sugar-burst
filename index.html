<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ff5fa2">
<meta name="description" content="Sugar Burst — a candy match-3 puzzle game with 60 levels, special candies and super combos.">
<title>Sugar Burst</title>
<link rel="stylesheet" href="css/style.css?v=1.1.0">
</head>
<body>
<div id="app">
  <div id="screen-loading" class="screen on">
    <div class="load-wrap">
      <div class="logo"><span class="name">Sugar<br>Burst</span><span class="tag">CANDY MATCH-3</span></div>
      <div class="load-bar" id="load-bar"><i></i></div>
      <div class="load-pct" id="load-pct">0%</div>
      <div class="load-msg" id="load-msg" hidden></div>
    </div>
  </div>

  <div id="screen-title" class="screen">
    <canvas id="title-canvas"></canvas>
    <div class="title-wrap">
      <div class="logo"><span class="name">Sugar<br>Burst</span><span class="tag">CANDY MATCH-3</span></div>
    </div>
    <div class="title-foot">Swipe to swap candies · Match 3 to clear</div>
  </div>

  <div id="screen-map" class="screen">
    <div id="map-scroll"><div id="map-inner"></div></div>
    <div class="map-top">
      <div class="pill" id="pill-stars"><img alt=""><span>0</span></div>
      <div class="pill" id="pill-coins"><img alt=""><span class="coin-val">0</span><i class="plus">+</i></div>
      <div class="spacer"></div>
      <button class="round-btn" id="btn-set" aria-label="Settings"></button>
    </div>
    <button class="map-ad" id="map-ad" aria-label="Watch an ad for free coins"></button>
  </div>

  <div id="screen-game" class="screen">
    <canvas id="board"></canvas>
    <div class="hud-top">
      <div class="hud-sub">
        <button class="round-btn" id="btn-pause" aria-label="Pause"></button>
        <div class="lvl-tag" id="lvl-tag">Level 1</div>
        <div style="width:38px"></div>
      </div>
      <div class="hud-row">
        <div class="hud-panel moves-box" id="moves-box"><div class="hud-lbl">MOVES</div><div class="num o-text" id="moves-num">0</div></div>
        <div class="hud-panel goals-box"><div class="hud-lbl">GOALS</div><div class="goals" id="goals"></div></div>
        <div class="hud-panel score-box"><div class="hud-lbl">SCORE</div><div class="num" id="score-num">0</div><div class="sbar" id="sbar"><div class="fill"></div></div></div>
      </div>
    </div>
    <div class="boost-tip" id="boost-tip"></div>
    <div class="hud-bottom" id="boosters"></div>
    <img class="hand" id="hand" alt="" style="left:0;top:0">
  </div>

  <canvas id="fx"></canvas>
  <div id="modal"></div>
  <div id="toast"></div>
  <div class="fade-cover" id="cover"></div>
</div>
<div id="rotate"><i></i>Please rotate to portrait</div>
<script src="js/tuning.js?v=1.1.0"></script>
<script src="js/model.js?v=1.1.0"></script>
<script src="js/levels.js?v=1.1.0"></script>
<script src="js/assets.js?v=1.1.0"></script>
<script src="js/audio.js?v=1.1.0"></script>
<script src="js/game.js?v=1.1.0"></script>
<script src="js/ui.js?v=1.1.0"></script>
</body>
</html>
